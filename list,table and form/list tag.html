<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lists</title>
</head>
<body><!--ol for order list , in numbers like 1,2,3,4,5-->
  <!--ul is used for unorder list-->
  <h1>to do list--</h1>
  <ol>
<li>traveling</li>
<li>hicking</li>
<li>exploring</li>
<li>bathing</li>
<li>spitting</li> 
</ol>
  <h1>to  not to do list</h1>
  <ul>
 <li>boom boom</li>
<li>thoo</li>
<li>bhuuuuu</li>
<li>meaw</li>
<li>mighty raju</li>
  </ul>
  <br>
  <ol type="I">
  <li>html</li>
  <ol type="a"><!--in ol we can create another ol or ul-->
    <li>bgmi</li>
    <li>freefire</li>
  </ol>
<li>css</li>
<li>java script</li>
<!-- in <ol>type can be use to determine the character like A,a,i,I -->
  </ol>
</body>
</html><!-- ul-unorder list
