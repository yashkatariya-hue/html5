<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>table tags</title>
</head>
<body>
  <table border="1">
    <caption>students information</caption>
    <tr>
      <th colspan="3">all the information about students</th>
    </tr>
    <tr>
      <th>name</th>
      <th>class</th>
      <th>roll no</th>
    </tr>
    <tr>
      <td>yash</td>
      <td>12th</td>
      <td>30</td>
    </tr>
    <tr>
      <td><a href="https://www.bing.com/ck/a?!&&p=b3aec34345a72bede48e8c904173d8ac64ec6bbd2375d41e456a062f525179a0JmltdHM9MTc4NDE2MDAwMA&ptn=3&ver=2&hsh=4&fclid=1a877b0c-2c14-6862-1003-6dc42de669f0&psq=cbse+result+2026&u=a1aHR0cHM6Ly93d3cuY2JzZS5nb3YuaW4v"target="_blank">saksham</a></td>
      <td>12th</td>
      <td>20</td>
    </tr>
    <tr>
      <td>krishan</td>
      <td>12th</td>
      <td>40</td>

    </tr>
  </table>
</body>
</html>
<!--
boarder for table adjustment
 th--table heading 
 tr--table row
 td--table data
 caption--to write somthing on the top of the table
 <th or td colspan>--to merge space in the table
 -->
